# Render Blueprint — public recruiter demo with OpenAI answers + spend caps.
#
# 1. Create a Neon (or other) Postgres with pgvector; set DATABASE_URL below
#    as postgresql+asyncpg://USER:PASSWORD@HOST/DB?ssl=require
# 2. Set OPENAI_API_KEY in the Render dashboard (sync: false — never commit it)
# 3. Set a hard monthly budget in the OpenAI billing dashboard ($5–10 recommended)
# 4. DEMO_MODE=false + key → real OpenAI RAG; PUBLIC_DEMO=true locks uploads
#
# Free Render web services sleep when idle (cold start ~30–60s).

services:
  - type: web
    name: enterprise-knowledge-assistant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: SEED_DEMO_DOCUMENTS
        value: "true"
      - key: PUBLIC_DEMO
        value: "true"
      - key: OPENAI_CHAT_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: TOP_K
        value: "3"
      - key: QUERY_RATE_LIMIT_PER_IP
        value: "8"
      - key: QUERY_DAILY_GLOBAL_LIMIT
        value: "40"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
