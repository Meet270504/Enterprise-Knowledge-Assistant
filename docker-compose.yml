services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: eka_secret
      POSTGRES_DB: eka
    ports:
      - "5432:5432"
    volumes:
      - eka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eka -d eka"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://eka:eka_secret@db:5432/eka
      DATABASE_URL_SYNC: postgresql://eka:eka_secret@db:5432/eka
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO_DOCUMENTS: ${SEED_DEMO_DOCUMENTS:-true}
      PUBLIC_DEMO: ${PUBLIC_DEMO:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-5}
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.12}
    volumes:
      - eka_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  eka_pgdata:
  eka_uploads:
